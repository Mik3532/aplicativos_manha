<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <main>
        <div class="form-container">
            <h3>Cadastro de Aluno</h3>
            <form action="/novoaluno" method="POST">
                <div class="form-group">
                    <label for="ra">RA:</label>
                    <input type="text" id="ra" name="ra" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="Nome" maxlength="80" required>
                </div>
                <div class="form-group">
                    <label for="tempoestudo">Tempo de Estudo (em horas):</label>
                    <input type="number" id="tempoestudo" name="tempoestudo" required>
                </div>
                <div class="form-group">
                    <label for="rendafamiliar">Renda Familiar:</label>
                    <input type="number" id="rendafamiliar" name="rendafamiliar" required>
                </div>
                <input id="registra" type="submit" value="Registrar">
            </form>
        </div>
    </main>
</body>
</html>
